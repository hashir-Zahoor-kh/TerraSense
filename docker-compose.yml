services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: terrasense
      POSTGRES_PASSWORD: terrasense
      POSTGRES_DB: terrasense
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U terrasense"]
      interval: 5s
      timeout: 5s
      retries: 5

  mcp_server:
    build: ./mcp_server
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://terrasense:terrasense@db:5432/terrasense
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./mcp_server:/app
      - /tmp/terrasense_workspaces:/tmp/terrasense_workspaces

volumes:
  postgres_data:
